name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test, and lint (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.83", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu-system-arm + gcc-arm-none-eabi (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm gcc-arm-none-eabi
          qemu-system-arm --version
          arm-none-eabi-gcc --version
          # Canonical oracle is 10.2.1 but apt ships 8.2.2, which the suite
          # is proven against (both are in ORACLE_VERSIONS in
          # vioarm-qemu/src/qemu.rs); anything else skips the oracle tests.
          qemu-system-arm --version | grep -Eq "10\.2\.1|8\.2\.2" || echo "warn: foreign qemu, oracle tests will skip"

      - name: Install qemu + gcc-arm-embedded (macos)
        if: matrix.os == 'macos-latest'
        run: |
          brew install qemu gcc-arm-embedded
          qemu-system-arm --version || echo "warn: qemu-system-arm not on PATH, oracle tests skip"
          arm-none-eabi-gcc --version || echo "warn: arm-none-eabi-gcc not on PATH, CMSIS tests skip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit cargo-deny --locked
          cargo audit
          cargo deny check --deny warnings

      - name: Coverage
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-llvm-cov --locked || true
          cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 85

      - name: Coverage report
        if: always() && matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov report

      - name: Upload coverage
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lcov-info
          path: lcov.info

  windows:
    name: Build and lint (windows-latest, stable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      # No fmt (platform-independent, covered on ubuntu) and no tests
      # (Windows has no qemu-system-arm / arm-none-eabi-gcc provisioning
      # worth trusting); this leg guards against platform compile breaks.
      - name: Build
        run: cargo build --workspace

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  bench:
    name: Benchmarks (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-bench-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Correctness of the benches (cycle assertions), not wall-time
      # gating: shared runners are too noisy for that (see
      # vioarm-core/benches/BENCHMARKS.md for the regression policy).
      - name: Run benches
        run: cargo bench -p vioarm-core --bench mips -- --sample-size 10 --measurement-time 2 --warm-up-time 1

  pytest:
    name: Framework integration (pytest, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcc-arm-none-eabi
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-pytest-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install -r pytest/requirements.txt

      - name: Build the CLI
        run: cargo build -p vioarm-cli

      - name: Run pytest suite
        run: VIOARM_BIN=$PWD/target/debug/vioarm-cli python -m pytest pytest/ -v

  book:
    name: Build the mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: cargo install mdbook --locked

      - name: Build book
        run: mdbook build docs

  publish:
    name: Publish dry-run (vioarm-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Dry-run publish
        # vioarm-core first: gdb/qemu/cli depend on it from crates.io, so
        # they can only dry-run after core is really published (order and
        # tokens are in RELEASING.md).
        run: cargo publish --dry-run -p vioarm-core
