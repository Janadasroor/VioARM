name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test, and lint (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.75", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu-system-arm
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-arm --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit
        if: matrix.toolchain == 'stable'
        run: |
          cargo install cargo-audit cargo-deny --locked || true
          cargo audit
          cargo deny check

      - name: Coverage
        if: matrix.toolchain == 'stable'
        run: |
          cargo install cargo-llvm-cov --locked || true
          cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 85