name: Kings re-verification

# Famous-firmware end-to-end: rebuild from upstream, run on release
# VioARM, check functional gates + pinned cycles. Weekly + manual only
# (~2h wall); per-commit would burn the runner budget for no signal.
#
# The full suite needs ~5h (the TI boards alone are ~57 min each), which
# does not fit one 300-min job -- a single-job run was killed at exactly
# the timeout. It is therefore split across parallel phase jobs; each job
# builds and fetches only what its phase needs (see KINGS_PHASES).
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      phase:
        description: "Run one phase only (all = every phase)"
        type: choice
        default: all
        options: [all, core, tflm, tiva1, tiva2]

# Never run two sweeps of the same scope at once; a fresh dispatch
# supersedes a stale run. The phase is part of the group so a targeted
# re-run of one phase does not cancel a sweep of the others.
concurrency:
  group: kings-${{ github.ref }}-${{ inputs.phase || 'all' }}
  cancel-in-progress: true

jobs:
  kings:
    name: Kings ${{ matrix.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs do every phase; a manual dispatch may name one.
        phase: ${{ fromJSON(inputs.phase != '' && inputs.phase != 'all' && format('["{0}"]', inputs.phase) || '["core", "tflm", "tiva1", "tiva2"]') }}
    env:
      KINGS_PHASES: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure KINGSWORK
        run: echo "KINGSWORK=$RUNNER_TEMP/kings" >> "$GITHUB_ENV"
      - name: Cache pinned ARM toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/armtc-14.2.rel1
          key: armtc-14.2.rel1-linux-x64
      - name: Install pinned ARM toolchain (14.2.Rel1)
        run: |
          # The cycle pins in expected.sh / expected_embench.tsv are
          # coupled to the compiler that produced the firmware: aha-mont64
          # is +5.9% and FreeRTOS's periods jitter +-1 cycle under the
          # distro's arm-none-eabi-gcc 13.2.1. Pin the exact toolchain the
          # pins were captured with so the suite is reproducible.
          TC=14.2.rel1
          DIR="$RUNNER_TEMP/armtc-$TC"
          if [ ! -x "$DIR/bin/arm-none-eabi-gcc" ]; then
            FILE="arm-gnu-toolchain-$TC-x86_64-arm-none-eabi.tar.xz"
            curl -fsSL --retry 3 --retry-all-errors \
              "https://developer.arm.com/-/media/Files/downloads/gnu/$TC/binrel/$FILE" \
              -o "$RUNNER_TEMP/$FILE"
            mkdir -p "$DIR"
            tar -xJf "$RUNNER_TEMP/$FILE" -C "$DIR" --strip-components=1
          fi
          echo "$DIR/bin" >> "$GITHUB_PATH"
      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy g++ python3
          arm-none-eabi-gcc --version | head -n 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build release vioarm
        run: cargo build --release -p vioarm-cli
      - name: Fetch upstream firmware
        run: bash scripts/kings/fetch.sh
      - name: Build + run + check
        run: |
          export VIOARM_BIN="$PWD/target/release/vioarm-cli"
          bash scripts/kings/run_all.sh
      # UART captures + full sim logs: without these a failed gate is
      # undiagnosable (the pass/fail line alone says nothing about *why*).
      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-logs-${{ matrix.phase }}
          path: ${{ runner.temp }}/kings/*.log*
          if-no-files-found: ignore
          retention-days: 14