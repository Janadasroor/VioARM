[workspace]

[package]
name = "fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vioarm-core = { path = "../vioarm-core" }
arbitrary = "1.4"

[[bin]]
name = "fuzz_elf"
