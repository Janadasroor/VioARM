[workspace]

[package]
name = "fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vioarm-core = { path = "../vioarm-core", features = ["jit"] }
vioarm-gdb = { path = "../vioarm-gdb" }
vioarm-svd = { path = "../vioarm-svd" }
arbitrary = "1.4"

[[bin]]
name = "fuzz_elf"
path = "src/bin/fuzz_elf.rs"

[[bin]]
name = "fuzz_hex"
path = "src/bin/fuzz_hex.rs"

[[bin]]
name = "fuzz_decode"
path = "src/bin/fuzz_decode.rs"

[[bin]]
name = "fuzz_rsp"
path = "src/bin/fuzz_rsp.rs"

[[bin]]
name = "fuzz_svd"
path = "src/bin/fuzz_svd.rs"

[[bin]]
name = "fuzz_jit"
path = "src/bin/fuzz_jit.rs"
