# C header for the `vioarm-cosim` embedding ABI (E2 packaging).
#
# Generated by cbindgen from `src/lib.rs` — never hand-edit (a regression
# test fails the build on drift against the checked-in copy in `include/`).
# (The target crate comes from the build script's `with_crate`, not here.)

header = """/* vioarm_cosim.h — C ABI of the `vioarm-cosim` embedding crate.
 *
 * GENERATED BY cbindgen from `vioarm-cosim/src/lib.rs` (E2 packaging).
 * Do not hand-edit: `cargo test -p vioarm-cosim` fails on drift.
 * Conventions live in the SAFETY CASE and the frozen contract
 * (`docs/src/embedding.md`).
 */"""

include_guard = "VIOARM_COSIM_H"
autogen_warning = "/* Warning: this file is generated by cbindgen. Do not modify manually. */"
language = "C"
style = "both"
usize_is_size_t = true

[defines]
"target_os = freebsd" = "DEFINE_FREEBSD"
"target_os = openbsd" = "DEFINE_OPENBSD"

[export]
prefix = ""
