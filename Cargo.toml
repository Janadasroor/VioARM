[workspace]
resolver = "2"
members = ["vioarm-core", "vioarm-cli", "vioarm-svd", "vioarm-gdb", "vioarm-qemu", "vioarm-jit-call"]

[workspace.package]
version = "1.9.1"
edition = "2021"
license = "MIT"
rust-version = "1.83"
description = "ARM Cortex-M ISS — ARMv6-M/ARMv7-M/ARMv7E-M/ARMv8-M baseline with FPv5-D16, validated against QEMU"
repository = "https://github.com/Janadasroor/VioARM"
homepage = "https://github.com/Janadasroor/VioARM"
documentation = "https://docs.rs/vioarm-core"
readme = "README.md"
keywords = ["arm", "cortex-m", "emulator", "iss", "qemu"]
categories = ["emulators", "embedded"]
authors = ["Janadasroor"]

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "allow"
unused_variables = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
nursery = "allow"
too_many_arguments = "allow"
cognitive_complexity = "allow"
too_many_lines = "allow"
type_complexity = "allow"
similar_names = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
approx_constant = "allow"
manual_range_contains = "allow"

[profile.release]
lto = true